[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "archivarius"
version = "0.1.0"
description = "Локальный вопросно-ответный поиск по документам: гибридное извлечение (BM25 + векторы) и языковые модели через Ollama"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Бондаренко Григорий Александрович", email = "grisha.bondarenko76@gmail.com" }]
keywords = ["rag", "ollama", "retrieval", "bm25", "llm", "search", "russian"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Natural Language :: Russian",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "numpy>=1.24",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "snowballstemmer>=2.2",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
archivarius = "archivarius.cli:app"

[project.urls]
Repository = "https://github.com/Gregory-Bondarenko/archivarius"

[tool.hatch.build.targets.wheel]
packages = ["src/archivarius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905", "SIM905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501", "UP031"]
